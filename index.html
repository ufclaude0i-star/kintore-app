<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>筋トレ継続アプリ（試作版）</title>
<meta name="apple-mobile-web-app-title" content="筋トレ（試作）">
<meta name="theme-color" content="#FAFAF9">
<style>
/* ============================================================
   設計言語（参照UIから抽出）
   白基調 / 1pxの細い線 / 淡い色面 / 黒の主ボタン / 影なし
   ============================================================ */
:root{
  --bg:#FAFAF9;
  --card:#FFFFFF;
  --sunken:#F5F5F4;
  --line:#E7E5E4;
  --line2:#D6D3D1;
  --txt:#1C1917;
  --dim:#78716C;
  --dim2:#A8A29E;
  --ink:#171717;

  --blue-bg:#EFF4FF;
  --blue-line:#C7D9F7;
  --blue-txt:#2563A8;

  --mint-bg:#E8F6F1;
  --mint-line:#A9DECD;
  --mint-txt:#1F7A5E;
  --mint:#4FC0A8;

  --rose-bg:#FDF0EE;
  --rose-line:#F3C9C0;
  --rose-txt:#B4503C;

  --r-card:14px;
  --r-btn:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:430px;margin:0 auto;padding:20px 16px 64px;min-height:100vh}

/* ---------- 部品 ---------- */
.seclabel{font-size:12px;color:var(--dim);margin:22px 2px 8px;font-weight:600;letter-spacing:.02em}
.seclabel:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 16px}
.card + .card{margin-top:10px}
.card.tight{padding:14px 16px}
.card.sunken{background:var(--sunken);border-color:var(--line)}

.h1{font-size:19px;font-weight:700;line-height:1.5;margin:0 0 2px}
.h2{font-size:15px;font-weight:700;margin:0 0 6px}
.sub{font-size:13px;color:var(--dim);margin:0}
.tiny{font-size:12px;color:var(--dim2);line-height:1.6}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

.btn{
  display:block;width:100%;border:none;border-radius:var(--r-btn);
  padding:14px 16px;font-size:15px;font-weight:700;font-family:inherit;
  cursor:pointer;text-align:center;transition:opacity .12s;
}
.btn:active{opacity:.72}
.btn-primary{background:var(--ink);color:#fff}
.btn-blue{background:var(--blue-bg);color:var(--blue-txt);border:1px solid var(--blue-line)}
.btn-mint{background:var(--mint-bg);color:var(--mint-txt);border:1px solid var(--mint-line)}
.btn-plain{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.btn-ghost{background:transparent;color:var(--dim);font-weight:600;font-size:13px;padding:10px}
.btn + .btn{margin-top:8px}
.row{display:flex;gap:8px}
.row > .btn{margin-top:0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid1{display:grid;grid-template-columns:1fr;gap:8px}

.chip{
  border:1px solid var(--line);background:var(--card);border-radius:var(--r-btn);
  padding:11px 6px;font-size:13px;font-weight:600;font-family:inherit;color:var(--txt);
  cursor:pointer;text-align:center;
}
.chip.on{background:var(--mint-bg);border-color:var(--mint-line);color:var(--mint-txt)}
.chip:active{opacity:.72}

.kv{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none;padding-bottom:0}
.kv:first-child{padding-top:0}
.kv .k{font-size:13px;color:var(--dim)}
.kv .v{font-size:15px;font-weight:700}
.kv .v small{font-size:12px;font-weight:600;color:var(--dim);margin-left:2px}

.note{border-radius:var(--r-btn);padding:12px 14px;font-size:13px;line-height:1.65}
.note-rose{background:var(--rose-bg);border:1px solid var(--rose-line);color:var(--rose-txt)}
.note-mint{background:var(--mint-bg);border:1px solid var(--mint-line);color:var(--mint-txt)}
.note-gray{background:var(--sunken);border:1px solid var(--line);color:var(--dim)}
.note b{font-weight:700}

.dots{display:flex;gap:4px;margin-bottom:16px}
.dot{height:4px;flex:1;border-radius:2px;background:var(--line2)}
.dot.on{background:var(--mint)}

input[type=text],input[type=url],input[type=number]{
  width:100%;border:1px solid var(--line);border-radius:var(--r-btn);
  padding:11px 12px;font-size:14px;font-family:inherit;color:var(--txt);background:var(--card);
}
input:focus{outline:2px solid var(--mint-line);outline-offset:-1px}
label.fl{display:block;font-size:12px;font-weight:600;color:var(--dim);margin:0 0 6px}
.field + .field{margin-top:14px}

/* ---------- セット画面 ---------- */
.stage{min-height:calc(100vh - 40px);display:flex;flex-direction:column}
.stage-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px 0}
.ring-wrap{position:relative;width:236px;height:236px}
.ring-wrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:6}
.ring-fg{fill:none;stroke:var(--mint);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .18s linear}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.repnum{font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.reptot{font-size:15px;color:var(--dim);font-weight:600;margin-top:6px}
.phase{font-size:14px;font-weight:700;color:var(--dim);letter-spacing:.14em;height:22px}
.phase.down{color:var(--blue-txt)}
.phase.up{color:var(--mint-txt)}
.pulse{transition:transform .25s cubic-bezier(.2,.9,.3,1)}
.pulse.big{transform:scale(1.045)}

.moodbtn{
  border:1px solid var(--line);background:var(--card);border-radius:var(--r-card);
  padding:22px 12px;font-family:inherit;cursor:pointer;text-align:center;width:100%;
}
.moodbtn .em{font-size:30px;line-height:1.2}
.moodbtn .lb{font-size:15px;font-weight:700;margin-top:4px}
.moodbtn .ds{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.5}
.moodbtn.good{background:var(--mint-bg);border-color:var(--mint-line)}
.moodbtn.hard{background:var(--blue-bg);border-color:var(--blue-line)}
.moodbtn:active{opacity:.72}

.timerbig{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}

.hidden{display:none !important}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.divider{height:1px;background:var(--line);margin:14px 0}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:13px;font-weight:600;
  padding:11px 18px;border-radius:999px;z-index:99;max-width:88vw;text-align:center;
  opacity:0;transition:opacity .25s;pointer-events:none;
}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<audio id="pod" preload="none"></audio>

<script>
"use strict";

/* ==========================================================
   0. 種目の「はしご」— レベルが下がるほど軽い
   気分メーターは自動で下げるだけ。上げるのは本人が選んだときだけ。
   ========================================================== */
const EXERCISES = [
  // part: upper(上半身の押す)/back(背中)/lower(下半身)/core(体幹)/cardio(体力)
  // place: home=自宅（器具なし） gym=ジム
  { id:"push", name:"腕立て伏せ", part:"upper", place:["home"], levels:[
      {n:"壁腕立て",      reps:5},
      {n:"壁腕立て",      reps:10},
      {n:"膝つき腕立て",  reps:5},
      {n:"膝つき腕立て",  reps:8},
      {n:"膝つき腕立て",  reps:12},
      {n:"腕立て伏せ",    reps:5},
      {n:"腕立て伏せ",    reps:8},
      {n:"腕立て伏せ",    reps:12},
      {n:"腕立て伏せ",    reps:15},
  ]},
  { id:"squat", name:"スクワット", part:"lower", place:["home"], levels:[
      {n:"椅子スクワット", reps:5},
      {n:"椅子スクワット", reps:10},
      {n:"スクワット",     reps:5},
      {n:"スクワット",     reps:10},
      {n:"スクワット",     reps:15},
      {n:"スクワット",     reps:20},
      {n:"スクワット",     reps:25},
  ]},
  { id:"crunch", name:"上体起こし", part:"core", place:["home","gym"], levels:[
      {n:"クランチ", reps:5},
      {n:"クランチ", reps:10},
      {n:"クランチ", reps:15},
      {n:"クランチ", reps:20},
      {n:"クランチ", reps:25},
      {n:"クランチ", reps:30},
  ]},
  { id:"lunge", name:"ランジ", part:"lower", place:["home"], levels:[
      {n:"壁に手をついてランジ", reps:6},
      {n:"壁に手をついてランジ", reps:10},
      {n:"ランジ", reps:6},
      {n:"ランジ", reps:10},
      {n:"ランジ", reps:14},
      {n:"ランジ", reps:20},
  ]},
  { id:"superman", name:"背中（スーパーマン）", part:"back", place:["home"], levels:[
      {n:"スーパーマン", reps:5},
      {n:"スーパーマン", reps:8},
      {n:"スーパーマン", reps:12},
      {n:"スーパーマン", reps:15},
      {n:"スーパーマン", reps:20},
  ]},
  { id:"legraise", name:"脚上げ", part:"core", place:["home","gym"], levels:[
      {n:"膝を曲げた脚上げ", reps:5},
      {n:"膝を曲げた脚上げ", reps:10},
      {n:"レッグレイズ", reps:5},
      {n:"レッグレイズ", reps:10},
      {n:"レッグレイズ", reps:15},
  ]},
  { id:"highknee", name:"その場もも上げ", part:"cardio", place:["home","gym"], tempo:900, levels:[
      {n:"その場もも上げ", reps:20},
      {n:"その場もも上げ", reps:30},
      {n:"その場もも上げ", reps:40},
      {n:"その場もも上げ", reps:60},
  ]},
  { id:"burpee", name:"バーピー", part:"cardio", place:["home","gym"], tempo:3500, levels:[
      {n:"ゆっくりバーピー（跳ばない）", reps:3},
      {n:"ゆっくりバーピー（跳ばない）", reps:5},
      {n:"バーピー", reps:5},
      {n:"バーピー", reps:8},
      {n:"バーピー", reps:12},
  ]},
  gymLadder("chestpress",   "チェストプレス",           "upper"),
  gymLadder("shoulderpress","ショルダープレス",         "upper"),
  gymLadder("latpull",      "ラットプルダウン",         "back"),
  gymLadder("legpress",     "レッグプレス",             "lower"),
  gymLadder("legcurl",      "レッグカール",             "lower"),
  gymLadder("abdominal",    "腹筋マシン",               "core"),
];
// ジムのマシン種目：重さの目安（軽め→普通→重め）と回数で段階をつくる
function gymLadder(id,name,part){
  const levels=[];
  [["軽め",[8,10,12]],["普通",[8,10,12]],["重め",[8,10]]].forEach(([w,rs])=>rs.forEach(r=>levels.push({n:`${name}（${w}）`,reps:r})));
  return {id,name,part,place:["gym"],levels};
}
function tempoFor(exId){ const e=EXERCISES.find(x=>x.id===exId); return (e&&e.tempo)||S.tempoMs; }

/* ==========================================================
   0b. 今日のメニューを自動で組む
   いまはルールで組んでいる。将来ここをAI（LLM）に差し替える前提で、
   入力（profile）と出力（{items, rest, estMin}）の形を固定している。
   ========================================================== */
const GOALS = {
  look:    {label:"見た目を変えたい", parts:["upper","lower","back","core","upper"]},
  health:  {label:"健康のため",       parts:["lower","upper","core","back","cardio"]},
  stamina: {label:"体力をつけたい",   parts:["cardio","lower","upper","core","cardio"]},
};
const EXPS = {
  first: {label:"初めて",         frac:0},
  again: {label:"前にやっていた", frac:0.3},
  cont:  {label:"今も続けている", frac:0.65},
};
const PLACES = { home:"自宅（器具なし）", gym:"ジム" };
const TIMES = {
  5:  {label:"5分",  n:3, sets:1, rest:30},
  15: {label:"15分", n:4, sets:2, rest:60},
  30: {label:"30分", n:5, sets:3, rest:60},
};
function dayNo(){ return Math.floor(parseDate(todayStr()).getTime()/86400000); }
function buildMenu(profile, opt){
  opt=opt||{};
  const t = TIMES[opt.short ? 5 : profile.minutes];
  const parts = GOALS[profile.goal].parts.slice(0, t.n);
  const pool = EXERCISES.filter(e=>e.place.includes(profile.place));
  const seed = dayNo(), used = new Set(), items = [];
  parts.forEach((part,i)=>{
    let c = pool.filter(e=>e.part===part && !used.has(e.id));
    if(!c.length) c = pool.filter(e=>!used.has(e.id));
    if(!c.length) return;
    const ex = c[(seed+i) % c.length];      // 日によって種目が入れ替わる（同じ日は同じ）
    used.add(ex.id);
    items.push({ex:ex.id, name:ex.name, sets:t.sets});
  });
  // 所要時間の目安：動く時間＋準備と気分メーター15秒＋休憩（最後の休憩はない）
  let sec = 0;
  items.forEach(it=>{ const l=lvOf(it.ex); sec += it.sets*(l.reps*tempoFor(it.ex)/1000 + 15 + t.rest); });
  sec -= t.rest;
  return {items, rest:t.rest, estMin:Math.max(1, Math.round(sec/60))};
}
// 経験に合わせて、最初の段階を決める（気分メーターで下がるのは今までどおり）
function applyExperience(exp){
  const f = EXPS[exp].frac;
  EXERCISES.forEach(e=>{ S.levels[e.id]=Math.floor((e.levels.length-1)*f); S.goodStreak[e.id]=0;
    S.best[e.id]=Math.max(S.best[e.id]??0, S.levels[e.id]); });   // 開始段階は「上達」として記録しない
}
const REST_BANK_CAP = 4;
const COMEBACK_DAYS = 7;
const WAGER_STOP_STREAK = 3;
// 前の版の機能（音声・今週の宣言・ポイント）。友達に試してもらう版では画面に出さない（コードは残してある）
const LEGACY = false;
const APP_VERSION = "2026-10-16d";   // 送った記録に付ける版の名前（集計で見分ける）

/* ==========================================================
   1. 状態
   ========================================================== */
const KEY = "kintore_proto_v1";
let S = null;

function todayStr(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseDate(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function daysBetween(a,b){ return Math.round((parseDate(b)-parseDate(a))/86400000); }
// 月曜はじまりの週キー
function weekKey(d){
  d = d ? new Date(d) : new Date();
  const day = (d.getDay()+6)%7;           // 月=0
  d.setDate(d.getDate()-day);
  return todayStr(d);
}

function freshState(){
  const lv = {};
  EXERCISES.forEach(e=>lv[e.id]=0);
  const gs = {};
  EXERCISES.forEach(e=>gs[e.id]=0);
  return {
    v:1,
    createdAt: todayStr(),
    lastSessionDate: null,
    sessions: [],                 // {date, sets:[{ex,reps,done,mood}], totalReps}
    levels: lv,
    goodStreak: gs,               // 種目ごとの「よかった」連続数
    restBank: 0,
    points: 3000,
    promise: "",                  // 自分で書いた約束
    tempoMs: 2400,
    weekly: { key: weekKey(), target:3, done:0, wager:0, declared:false },
    wagerEnabled: true,
    lossStreak: 0,
    ledger: [],                   // 精算の履歴
    pendingWagerStop: false,
    tomorrow: null,               // {date, ans}
    audio: { rss:"", url:"", title:"", pos:0 },
    profile: null,                // 最初の4問の答え {goal, exp, place, minutes}
  };
}
/* LINEなどアプリの中のブラウザで開かれていないか。
   そのままだと記録が消えたり、ホーム画面に追加できないことがあるので、ホームで案内する。 */
function isInApp(){
  return /\bLine\/|FBAN|FBAV|Instagram|KAKAOTALK|Twitter/i.test(navigator.userAgent || "");
}
let STORAGE_OK = true;
function checkStorage(){
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); STORAGE_OK = true; }
  catch(e){ STORAGE_OK = false; }
}
function load(){
  checkStorage();
  try{ const raw=localStorage.getItem(KEY); if(raw){ S=JSON.parse(raw); } }catch(e){}
  if(!S || S.v!==1) S = freshState();
  EXERCISES.forEach(e=>{ if(S.levels[e.id]==null) S.levels[e.id]=0; if(S.goodStreak[e.id]==null) S.goodStreak[e.id]=0; });
  if(!S.photo)  S.photo  = { last:null, count:0 };   // 成長写真の枚数と最後に撮った日（写真そのものはIndexedDB）
  if(!S.shares) S.shares = [];                       // 友達に送った記録（検証用）
  if(!S.best)   S.best = {};                          // 種目ごとに到達した一番上の段階（上達の記録用）
  EXERCISES.forEach(e=>{ if(S.best[e.id]==null) S.best[e.id]=S.levels[e.id]; });
  if(!S.milestones) S.milestones = [];                // 上達の記録 {date, ex, name, from, to, newMove}
  if(!S.events) S.events = [];                        // 試用の検証用：開いた・復帰画面・明日やる？などの出来事
  if(S.participant===undefined) S.participant = null; // 試用の参加者 {nick, joinedAt}
  settleWeeks();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ STORAGE_OK=false; } }

/* ---- 週の精算：静かに、開いた瞬間に済ませておく ----
   復帰画面に請求を出さないために、精算は必ず先に終わらせる。 */
function settleWeeks(){
  const cur = weekKey();
  if(!S.weekly){ S.weekly={key:cur,target:3,done:0,wager:0,declared:false}; return; }
  if(S.weekly.key === cur) return;

  const w = S.weekly;
  let shortfall = Math.max(0, w.target - w.done);
  let usedBank = 0, charged = 0, refunded = 0;

  if(shortfall > 0){
    usedBank = Math.min(shortfall, S.restBank);
    S.restBank -= usedBank;
    shortfall -= usedBank;
  }
  if(shortfall > 0 && w.wager > 0 && S.wagerEnabled){
    charged = shortfall * w.wager;
    S.points = Math.max(0, S.points - charged);
    S.lossStreak++;
  }else{
    if(w.wager>0 && S.wagerEnabled && w.done>=w.target){
      refunded = Math.round(w.wager*0.5);   // 達成者への分配（ダミー）
      S.points += refunded;
    }
    S.lossStreak = 0;
  }
  if(w.declared || charged || refunded || usedBank){
    S.ledger.unshift({week:w.key, target:w.target, done:w.done, wager:w.wager, usedBank, charged, refunded});
    S.ledger = S.ledger.slice(0,20);
  }
  if(S.lossStreak >= WAGER_STOP_STREAK && S.wagerEnabled){
    S.wagerEnabled = false;
    S.pendingWagerStop = true;
  }
  S.weekly = { key:cur, target:w.target, done:0, wager:(S.wagerEnabled? w.wager : 0), declared:false };
  save();
}

/* ---- 集計 ---- */
function totalReps(){ return S.sessions.reduce((a,s)=>a+s.totalReps,0); }
/* ---- 努力を数字で見せる ----
   見せるのは「減らない数字」と「過去の自分との比較」だけ。他人との比較・カロリーは出さない。
   ①②は自己申告なので、時間は「目安」と表示する。 */
function uniqueDays(list){ return new Set((list||S.sessions).map(s=>s.date)).size; }
// 1回の所要時間（秒）。時間を記録していない古いデータは回数から目安を出す
function sessSec(s){ return (s.sec!=null) ? s.sec : Math.round(s.totalReps*2.4 + (s.sets?s.sets.length:0)*15); }
function totalSec(){ return S.sessions.reduce((a,s)=>a+sessSec(s),0); }
function fmtDur(sec){ const m=Math.round(sec/60); if(m<60) return m+"分"; const h=Math.floor(m/60), r=m%60; return h+"時間"+(r? r+"分":""); }
function periodStats(from,to){
  const ss = S.sessions.filter(s=>s.date>=from && s.date<=to);
  return { days:uniqueDays(ss), reps:ss.reduce((a,s)=>a+s.totalReps,0), sec:ss.reduce((a,s)=>a+sessSec(s),0) };
}
function ymd(y,m,d){ return todayStr(new Date(y,m,d)); }
function monthStats(offset){           // 0=今月（今日まで） -1=先月 …
  const t = parseDate(todayStr()), y = t.getFullYear(), m = t.getMonth()+offset;
  const from = ymd(y,m,1), to = offset===0 ? todayStr() : ymd(y,m+1,0);
  return Object.assign({ label:(new Date(y,m,1).getMonth()+1)+"月", from, to }, periodStats(from,to));
}
function monthReview(){               // 今月と「先月の同じ日まで」を比べる（月初に少なく見えないように）
  const t = parseDate(todayStr()), y = t.getFullYear(), m = t.getMonth(), d = t.getDate();
  const lastLen = new Date(y,m,0).getDate();
  return { cur:monthStats(0), last:monthStats(-1), lastSame:periodStats(ymd(y,m-1,1), ymd(y,m-1,Math.min(d,lastLen))) };
}
function weekCompare(){               // 今週と「先週の同じ曜日まで」
  const k = daysBetween(weekKey(), todayStr());
  const lm = parseDate(weekKey()); lm.setDate(lm.getDate()-7);
  const ls = new Date(lm); ls.setDate(ls.getDate()+k);
  return { cur:periodStats(weekKey(), todayStr()), last:periodStats(todayStr(lm), todayStr(ls)) };
}
function milestonesBetween(from,to){ return (S.milestones||[]).filter(x=>(!from || x.date>from) && x.date<=to); }
function milestoneRow(x){ return `<div class="kv"><span class="k">${x.date}</span><span class="v" style="font-size:13px;font-weight:600">${x.name}：${x.from} → <b>${x.to}</b></span></div>`; }
function daysSince(){ return S.lastSessionDate ? daysBetween(S.lastSessionDate, todayStr()) : null; }
function isComeback(){ const d=daysSince(); return S.sessions.length>0 && d!==null && d>=COMEBACK_DAYS; }
function lastSessionFor(exId){
  for(const s of S.sessions){
    const hit = s.sets.filter(x=>x.ex===exId);
    if(hit.length) return hit;
  }
  return null;
}
function lvOf(exId){ const ex=EXERCISES.find(e=>e.id===exId); return ex.levels[Math.min(S.levels[exId], ex.levels.length-1)]; }

/* ==========================================================
   2. 音（WebAudio合成・音声素材ゼロ）
   下ろす＝低い小さなクリック / 上げきった＝1音
   目標回数の最後だけ和音で解決する
   ========================================================== */
const PENTA = [261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25,783.99,880.00,1046.50];
const A = {
  ctx:null,
  init(){
    if(this.ctx) return;
    try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  },
  resume(){ if(this.ctx && this.ctx.state==="suspended") this.ctx.resume(); },
  tone(freq, {dur=0.85, type="triangle", gain=0.16, at=0}={}){
    if(!this.ctx) return;
    const t = this.ctx.currentTime + at;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t+dur+0.05);
  },
  tick(){ this.tone(140,{dur:0.10,type:"sine",gain:0.05}); },
  // i回目 / 全n回。最後は和音。
  rep(i,n){
    if(i>=n){ this.chord(); return; }
    const span = PENTA.length-3;
    const idx = n<=1 ? 0 : Math.round((i-1)/(n-1)*span);
    this.tone(PENTA[Math.min(idx,PENTA.length-1)], {dur:0.75, gain:0.15});
  },
  chord(){
    [523.25,659.25,783.99,1046.50].forEach((f,k)=>{
      this.tone(f,{dur:1.5, gain:0.13, at:k*0.045, type:"triangle"});
    });
  },
  celebrate(){
    [523.25,659.25,783.99,1046.50,1318.51].forEach((f,k)=>{
      this.tone(f,{dur:1.1, gain:0.12, at:k*0.085});
    });
  },
};

/* ==========================================================
   3. ポッドキャスト（トレーニング中しか再生しない）
   ========================================================== */
const POD = {
  el(){ return document.getElementById("pod"); },
  ready(){ return !!S.audio.url; },
  start(){
    if(!this.ready()) return;
    const a = this.el();
    if(a.src !== S.audio.url) a.src = S.audio.url;
    a.volume = 0.8;
    try{ if(S.audio.pos>0) a.currentTime = S.audio.pos; }catch(e){}
    a.play().catch(()=>{});
  },
  duck(on){ const a=this.el(); if(a) a.volume = on?0.30:0.80; },
  stop(){
    const a=this.el();
    if(!a) return;
    S.audio.pos = a.currentTime||0;
    a.pause(); save();
  },
};

  const b = buildPlan(opt);   // 復帰のときは {short:true} で一番短いメニューにする
  sess = { plan:b.plan, rest:b.rest, idx:0, phase:"ready", results:[], startedAt:Date.now(), offer:null,
           comeback: !!(opt&&opt.short) || isComeback(), gapDays: daysSince() };
  go("session");
}

let workTimer=null;
function beginWork(){
  const it=curItem(), l=lvOf(it.ex);
  A.init(); A.resume(); POD.duck(true);
  sess.work = { target:l.reps, done:0, t0:Date.now(), lastTick:-1, lastNote:-1, T:tempoFor(it.ex) };
  sess.phase="work";
  render();
  clearInterval(workTimer);
  workTimer = setInterval(tickWork, 60);
}
function tickWork(){
  if(!sess || sess.phase!=="work"){ clearInterval(workTimer); return; }
  const w = sess.work, T = w.T || S.tempoMs;
  const el = Date.now()-w.t0;
  const repIdx = Math.floor(el/T);          // 0-based：いま何レップ目の最中か

  // 下ろす合図（各レップの頭）
  if(repIdx > w.lastTick && repIdx < w.target){ w.lastTick=repIdx; A.tick(); }
  // 上げきった（各レップの終わり）
  const noteIdx = Math.floor(el/T);
  if(noteIdx > w.lastNote && noteIdx>0){
    w.lastNote = noteIdx;
    w.done = Math.min(noteIdx, w.target);
    A.rep(w.done, w.target);
    paintWork(true);
    if(w.done >= w.target){
      clearInterval(workTimer);
      setTimeout(()=>{ POD.duck(false); sess.phase="mood"; render(); }, 1100);
      return;
    }
  }
  paintWork(false);
}
function paintWork(bump){
  const w=sess.work; if(!w) return;
  const el=Date.now()-w.t0, T=w.T||S.tempoMs;
  const inRep=(el%T)/T;                       // 0→1
  const down = inRep < 0.5;
  const num=document.getElementById("repnum");
  const ph=document.getElementById("phase");
  const fg=document.getElementById("ringfg");
  const box=document.getElementById("ringbox");
  if(num) num.textContent = w.done;
  if(ph){ ph.textContent = down? "おろす" : "あげる"; ph.className = "phase "+(down?"down":"up"); }
  if(fg){
    const C=2*Math.PI*106;
    const prog = Math.min(1, (w.done + (w.done<w.target? inRep:0))/w.target);
    fg.style.strokeDasharray=C; fg.style.strokeDashoffset=C*(1-prog);
  }
  if(box && bump){ box.classList.add("big"); setTimeout(()=>box.classList.remove("big"),240); }
}

  const sec = sess.quick ? (sess.estSec||0) : Math.min(5400, Math.round((Date.now()-sess.startedAt)/1000));
  S.sessions.unshift({ date: todayStr(), sets: sess.results, totalReps: reps, mode: sess.quick||"guided", sec, secEstimated: !!sess.quick });

function acceptOffer(){
  const id=sess.offer, ex=EXERCISES.find(e=>e.id===id);
  const before = S.levels[id];
  if(S.levels[id] < ex.levels.length-1) S.levels[id]++;
  const after = S.levels[id];
  let msg = "次から少しだけ増えます";
  // これまでで一番上の段階に上がったときだけ「上達」として残す（復帰後に戻っていく途中は数えない）
  if(after > before && after > (S.best[id]??-1)){
    const a = ex.levels[before], b = ex.levels[after];
    S.milestones.unshift({ date:todayStr(), ex:id, name:ex.name, from:`${a.n} ${a.reps}回`, to:`${b.n} ${b.reps}回`, newMove:a.n!==b.n });
    S.milestones = S.milestones.slice(0,100);
    S.best[id] = after;
    msg = (a.n!==b.n) ? `上達を記録しました：${b.n}に進みました` : "上達を記録しました。次から少しだけ増えます";
  }
  S.goodStreak[id]=0; sess.offer=null; save(); render(); toast(msg);
}

/* ---------------- 記録方法②：1タップで記録 ----------------
   音に合わせずに自分でやった日用。やった＝今日のメニューどおり、少しだけ＝各種目1セット分（目安） */
function quickRecord(kind){
  const m = buildMenu(S.profile);
  const results = [];
  m.items.forEach(it=>{
    const l = lvOf(it.ex), n = (kind==="full") ? it.sets : 1;
    for(let i=0;i<n;i++) results.push({ex:it.ex, name:it.name, reps:l.reps, target:l.reps, mood:null});
  });
  const estSec = Math.round(results.reduce((a,r)=>a + r.reps*tempoFor(r.ex)/1000 + 15, 0) + Math.max(0, results.length-1)*m.rest);
  sess = { plan:[], rest:m.rest, idx:0, phase:"done", results, offer:null, quick:kind, estSec,
           undo:{ weekly:S.weekly.done, restBank:S.restBank, last:S.lastSessionDate },   // 取り消し用
           comeback:isComeback(), gapDays:daysSince() };
  view = "session";
  finishSession();
}

// 押しまちがえた1タップ記録を、記録する前の状態に戻す
function undoQuick(){
  if(!sess || !sess.quick || !sess.undo) return;
  S.sessions.shift();
  S.weekly.done = sess.undo.weekly; S.restBank = sess.undo.restBank; S.lastSessionDate = sess.undo.last;
  logEvent("undo_quick"); sess = null; go("home"); toast("記録を取り消しました");
}
// 完了画面で、同じ種目のセットを1行にまとめる
function groupResults(results){
  const out = [];
  results.forEach(r=>{
    const g = out.find(x=>x.ex===r.ex);
    if(g){ g.total += r.reps; g.reps.push(r.reps); }
    else out.push({ ex:r.ex, name:r.name, total:r.reps, reps:[r.reps] });
  });
  return out;
}

/* ---------------- 成長記録（写真は自分だけが見る） ----------------
   写真はこの端末のブラウザ内（IndexedDB）にだけ保存する。サーバーには送らない。
   他の人の写真を見る一覧は作らない。友達に送るのは、本人が選んだ写真だけ。 */
const PDB = {
  db:null,
  open(){
    return new Promise((res,rej)=>{
      if(this.db) return res(this.db);
      let r; try{ r = indexedDB.open("kintore_photos",1); }catch(e){ return rej(e); }
      r.onupgradeneeded = ()=>r.result.createObjectStore("photos",{keyPath:"id"});
      r.onsuccess = ()=>{ this.db=r.result; res(this.db); };
      r.onerror = ()=>rej(r.error);
    });
  },
  async all(){ const db=await this.open(); return new Promise((res,rej)=>{
    const q=db.transaction("photos").objectStore("photos").getAll();
    q.onsuccess=()=>res(q.result.sort((a,b)=>b.ts-a.ts)); q.onerror=()=>rej(q.error); }); },
  async put(p){ const db=await this.open(); return new Promise((res,rej)=>{
    const t=db.transaction("photos","readwrite"); t.objectStore("photos").put(p);
    t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); },
  async del(id){ const db=await this.open(); return new Promise((res,rej)=>{
    const t=db.transaction("photos","readwrite"); t.objectStore("photos").delete(id);
    t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); },
};
// 容量を抑えるため、長い辺1000pxのJPEGに縮めて保存する
function shrinkImage(file, max){
  return new Promise((res,rej)=>{
    const u = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{
      const r = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b=> b? res(b) : rej(new Error("toBlob")), "image/jpeg", 0.85);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(u); rej(new Error("画像を読み込めませんでした")); };
    img.src = u;
  });
}

        ${e.ms.length? `<br>この間の上達：${e.ms.slice().reverse().map(x=>`${x.name} ${x.from} → ${x.to}`).join("、")}` : ""}</div>
    </div>`;
  }

  // 一覧
  html += `<div class="seclabel">これまでの写真（${POSES[pose]}・${mine.length}枚）</div>`;
  if(!mine.length){
    html += `<div class="card tight"><p class="tiny" style="margin:0">まだありません。1枚目が「はじめ」の記録になります。</p></div>`;

      html += `<div class="card tight">

    });
  }

  if(b) b.innerHTML = html;
}
async function addPhoto(ev){
  const f = ev.target.files && ev.target.files[0]; ev.target.value = "";
  if(!f) return;
  try{
    const blob = await shrinkImage(f, 1000);
    const id = Date.now()+"_"+Math.random().toString(36).slice(2,7);
    await PDB.put({id, ts:Date.now(), date:todayStr(), pose:photoState.pose, blob});
    S.photo.last = todayStr(); S.photo.count++; save();
    toast("保存しました（この端末の中だけ）");
    renderPhotos();
  }catch(e){ toast("保存できませんでした"); }
}
async function delPhoto(id){
  if(!confirm("この写真を削除します。元に戻せません。よろしいですか？")) return;
  await PDB.del(id);
  const rest = (await PDB.all());
  S.photo.count = rest.length; S.photo.last = rest.length ? rest.map(p=>p.date).sort().pop() : null; save();
  renderPhotos();
}
async function sharePhoto(id){
  const p = photoState.list.find(x=>x.id===id); if(!p) return;
  const file = new File([p.blob], `kintore_${p.date}.jpg`, {type:"image/jpeg"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], text:"筋トレの記録"}); logShare("photo","share"); }catch(e){}
  }else{
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    toast("写真を保存しました。LINEなどで友達に送れます");
    logShare("photo","download");
  }
}

/* ---------------- 試用の検証用：出来事の記録と「記録を送る」 ----------------
   記録は端末の中にだけある。送るのは本人がボタンを押したときだけ。
   写真そのものと「自分との約束」の文章は送らない。 */
function nowStamp(){ const d=new Date(); return todayStr(d)+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function logEvent(type, data){
  S.events = (S.events||[]).concat(Object.assign({t:nowStamp(), type}, data||{})).slice(-3000);
  save();
}
/* 入り口の数字：開いた → 4問を終えた → 1回記録した → 2日目も開いた、のどこまで進んだか。
   送る記録の中にまとめて入れておくと、集計が1回で済む。 */
function funnelStats(){
  const ev = S.events || [];
  const opens = ev.filter(e=>e.type==="open").map(e=>e.t);
  const days  = [...new Set(opens.map(t=>t.slice(0,10)))].sort();   // 念のため日付順に並べる
  const ob    = ev.find(e=>e.type==="onboard");
  const first = S.sessions[0];
  const last  = days[days.length-1] || null;
  return {
    firstOpen:   days[0] || S.createdAt || null,      // 初めて開いた日
    secondOpen:  days[1] || null,                     // 2日目に開いたか（空なら1日で終わった）
    lastOpen:    last,                                // 最後に開いた日
    openDays:    days.length,                         // 開いた日数
    onboardAt:   ob ? ob.t : null,                    // 最初の4問を終えた日時
    firstRecord: first ? first.date : null,           // 初めて記録した日
    recordDays:  uniqueDays(),                        // 記録した日数
    aliveDays:   (days[0] && last) ? daysBetween(days[0], last) : null,  // 初回から最後に開くまでの日数
    quietDays:   last ? daysBetween(last, todayStr()) : null,            // 最後に開いてから何日たったか
  };
}
function exportData(){
  return {
    format:"kintore-export", formatVersion:1, appVersion:APP_VERSION,
    funnel: funnelStats(),
    exportedAt:nowStamp(), today:todayStr(),
    participant:S.participant, createdAt:S.createdAt, profile:S.profile,
    sessions:S.sessions.map(s=>({ date:s.date, mode:s.mode||"guided", totalReps:s.totalReps,
      sec:(s.sec!=null? s.sec : null), secEstimated:!!s.secEstimated,
      sets:(s.sets||[]).map(x=>({ex:x.ex, reps:x.reps, target:x.target, mood:x.mood})) })),
    events:S.events, shares:S.shares, milestones:S.milestones, levels:S.levels,
    photo:{ count:S.photo.count, last:S.photo.last },     // 写真そのものは入れない
    weekly:S.weekly, restBank:S.restBank,
  };
}
function saveNick(){
  const v = document.getElementById("fNick").value.trim().slice(0,20);
  if(!v){ toast("ニックネームを入れてください"); return; }
  S.participant = Object.assign({joinedAt:todayStr()}, S.participant||{}, {nick:v});
  logEvent("join", {nick:v});
  render(); toast("保存しました");
}
async function sendExport(){
  const nick = (S.participant && S.participant.nick) || "";
  if(!nick){ toast("先にニックネームを入れて保存してください"); return; }
  logEvent("export");
  const name = `kintore_${nick.replace(/[\\/:*?"<>|\s]/g,"_")}_${todayStr()}.json`;
  const file = new File([JSON.stringify(exportData())], name, {type:"application/json"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:"筋トレ試用の記録", text:`筋トレ試用の記録（${nick}）`}); return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  toast("記録ファイルを保存しました。LINEのトークの「ファイル」から送ってください");
}
function copyExport(){
  if(!(S.participant && S.participant.nick)){ toast("先にニックネームを入れて保存してください"); return; }
  logEvent("export", {via:"copy"});
  if(navigator.clipboard) navigator.clipboard.writeText(JSON.stringify(exportData()))
    .then(()=>toast("コピーしました。LINEに貼り付けて送ってください"))
    .catch(()=>toast("コピーできませんでした"));
}

function pickFile(e){

  S.audio.url=URL.createObjectURL(f); S.audio.title=f.name; S.audio.pos=0; save(); render(); toast("この端末の音声を設定しました");

async function loadRss(){
  const url=document.getElementById("fRss").value.trim();
  if(!url) return toast("RSSのURLを入れてください");
  toast("読み込んでいます…");
  try{
    const res=await fetch(url);
    const txt=await res.text();
    const doc=new DOMParser().parseFromString(txt,"text/xml");
    const item=doc.querySelector("item");
    if(!item) throw new Error("no item");
    const enc=item.querySelector("enclosure");
    const src=enc? enc.getAttribute("url") : null;
    if(!src) throw new Error("no enclosure");
    S.audio.rss=url; S.audio.url=src; S.audio.pos=0;
    S.audio.title=(item.querySelector("title")?.textContent||"最新の回").trim().slice(0,50);
    save(); render(); toast("最新の回を取り込みました");
  }catch(err){
    toast("読み込めませんでした（②か③を使ってください）");
  }
}

/* ホーム画面から開き直したときに、ページが読み込み直されないことがある。
   画面が表示に戻ったとき、前回の記録から1時間以上たっていれば「開いた」として記録する。 */
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState !== "visible") return;
  const last = (S.events||[]).filter(e=>e.type==="open").slice(-1)[0];
  const ms = last ? (Date.now() - new Date(last.t.replace(" ","T")).getTime()) : Infinity;
  if(ms >= 60*60*1000){ logEvent("open", {view, resumed:true}); }
});
